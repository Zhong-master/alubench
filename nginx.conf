# VisionAI 3D Workbench — 静态托管配置
# 项目为纯前端 SPA，无后端接口；nginx 仅托管构建产物并处理路由回退
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩（3D 引擎 + Semi 体积较大，开启有明显收益）
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_vary on;

    # SPA 回退：未知路径交给 index.html（当前无 react-router，保留以兼容未来路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 产物带内容 hash，可永久缓存；不会变化的第三方 chunk 也在 assets/ 下
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 主文档不缓存，保证每次部署后刷新即拿到最新版本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
